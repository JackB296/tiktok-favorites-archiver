# Boots the official Cobalt instance + this archive app together.
#   docker compose up -d
# Then open http://localhost:8080
#
# This pulls the prebuilt app image from GHCR. To build from source instead
# (e.g. you're developing, or you want to audit what you run):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
services:
  cobalt:
    # Official Cobalt API image. Check https://github.com/imputnet/cobalt
    # (docs/run-an-instance) for the current tag if this one is stale.
    image: ghcr.io/imputnet/cobalt:11
    init: true
    restart: unless-stopped
    environment:
      API_URL: "http://cobalt:9000/"
      # Cobalt's built-in rate limits. The public defaults are meant for public
      # instances and make bulk syncs/backfills crawl: every call gets a 429 and
      # a ~53s backoff. This instance is private (not exposed outside the compose
      # network), so give the app real headroom. The app's own limiter
      # (RATE_MAX_CALLS/RATE_PERIOD below) must stay under RATELIMIT_MAX.
      #
      # There are TWO independent limits and BOTH must be raised. RATELIMIT_MAX
      # gates the resolve API (POST /). TUNNEL_RATELIMIT_MAX gates the media
      # stream (GET /tunnel) and defaults to only 40/min — so every download
      # after the first ~40 in a window 429s and fails, even though resolves
      # succeed. Each archived favorite makes one resolve AND one tunnel request,
      # so the tunnel budget must cover the download concurrency, not just the
      # resolve rate.
      RATELIMIT_MAX: "600"
      RATELIMIT_WINDOW: "60"
      TUNNEL_RATELIMIT_MAX: "600"
      TUNNEL_RATELIMIT_WINDOW: "60"
    expose:
      - "9000"

  app:
    image: ghcr.io/jackb296/tiktok-favorites-archiver:latest
    restart: unless-stopped
    # The container runs as root by default, which is simplest for a first run.
    # On Linux, to keep ./downloads and ./appdata owned by your own user
    # instead of root, create both folders first and uncomment (with your
    # uid:gid from `id -u`/`id -g`):
    # user: "1000:1000"
    depends_on:
      - cobalt
    environment:
      COBALT_API_URL: "http://cobalt:9000/"
      DOWNLOAD_DIR: "/app/downloads"
      DB_FILE: "/app/data/archive.db"
      APP_PORT: "8080"
      # Keep this comfortably below Cobalt's RATELIMIT_MAX/WINDOW above:
      # 4 calls/second = 240/minute < Cobalt's 600/minute resolve budget, and
      # the matching tunnel budget (TUNNEL_RATELIMIT_MAX) covers the downloads.
      CONCURRENCY: "4"
      RATE_MAX_CALLS: "4"
      RATE_PERIOD: "1.0"
      # Shazam pace: 1 recognition per N seconds. Shazam has no official API and
      # throttles sustained traffic — at 1/2s it began rejecting after ~150
      # requests, so pace bulk identification over a large library gently.
      SONG_ID_RATE_MAX_CALLS: "1"
      SONG_ID_RATE_PERIOD: "6.0"
      # Bundled CPU-only analyzers. These paths can be overridden for a custom
      # image, but the official image needs no host tools or hosted service.
      WHISPER_CPP_BIN: "/usr/local/bin/whisper-cli"
      WHISPER_MODEL: "/opt/whisper/models/ggml-base.bin"
      TESSERACT_BIN: "/usr/bin/tesseract"
      ANALYSIS_TIMEOUT: "900"
      OCR_INTERVAL_SECONDS: "2.0"
      OCR_MAX_FRAMES: "600"
      # Extra Host names the app may be reached at, comma-separated. Loopback
      # is always allowed. Set this when you access the app from another
      # device — see "Access from other devices" in the README. Examples:
      #   ALLOWED_HOSTS: "nas.local"                      # LAN hostname
      #   ALLOWED_HOSTS: "machine.tailnet-name.ts.net"    # Tailscale MagicDNS
      #   ALLOWED_HOSTS: "192.168.1.20,archive.home.lan"  # IP + reverse proxy
      # ALLOWED_HOSTS: ""
    ports:
      # Bound to localhost: the app has no authentication, so out of the box it
      # is not reachable from the rest of the network. (Plex reads ./downloads
      # from disk directly and is unaffected.)
      #
      # Tailscale users don't need to change this: `tailscale serve` proxies to
      # localhost. To expose the app on your LAN instead, replace the line with
      #   - "8080:8080"
      # and set ALLOWED_HOSTS above — everyone on the network can then reach
      # your archive, so only do that on a network you trust.
      - "127.0.0.1:8080:8080"
    volumes:
      # Media lands here on the host — point Plex at ./downloads.
      - ./downloads:/app/downloads
      # SQLite state (kept off the media folder).
      - ./appdata:/app/data
      # Optional managed Storage/NAS mount. Mount it on the host first, remove
      # the leading "#", then register /mnt/archive-storage in the Storage tab.
      # - /mnt/archive-storage:/mnt/archive-storage
